<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>나의 국어 기록 · [오름] 국어 학원</title>
<script src="config.js"></script>
<style>
:root{--navy:#1F3A5F;--navy2:#2C4A6E;--line:#E3E8F0;--tint:#F2F5FA;--txt:#22272E;--mut:#6B7685;--warm:#C26A3D}
*{box-sizing:border-box}
body{margin:0;background:#F6F8FB;color:var(--txt);font-family:'Pretendard','맑은 고딕','Malgun Gothic',sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.hd{background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px}
.hd small{opacity:.8}.hd h1{margin:4px 0 0;font-size:22px}
.dd{float:right;background:#fff;color:var(--navy);font-weight:800;border-radius:10px;padding:6px 12px;font-size:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
h2{font-size:17px;color:var(--navy);margin:0 0 10px}
.login label{display:block;font-size:13.5px;color:var(--mut);margin:12px 0 4px}
.login input{width:100%;font-size:17px;padding:11px 12px;border:1px solid #C9D2DF;border-radius:10px;font-family:inherit}
.login button{width:100%;margin-top:16px;font-size:17px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer;font-family:inherit}
.login button:disabled{opacity:.6}
.err{color:#B03A2E;font-size:14px;margin-top:10px;min-height:1em}
.kp{display:flex;gap:10px;flex-wrap:wrap}
.k{flex:1;min-width:120px;background:var(--tint);border-radius:10px;padding:10px 12px}
.k b{display:block;font-size:22px;color:var(--navy)}.k span{font-size:12.5px;color:var(--mut)}
.lg{font-size:12px;color:var(--mut);margin-right:12px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.br{display:grid;grid-template-columns:150px 1fr 92px;gap:8px;align-items:center;margin:7px 0;font-size:13.5px}
.bt{background:var(--tint);height:12px;border-radius:6px;overflow:hidden}.bf{height:100%}
.bv{text-align:right;font-weight:700}.bv small{font-weight:400;color:var(--mut)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw div{border-radius:10px;padding:10px 12px;font-size:14px}.st{background:#EEF3FA}.wk{background:#FBF1EC}.sw b{display:block;margin-bottom:4px}
details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}
summary{cursor:pointer;padding:10px 12px;font-weight:700;color:var(--navy)}summary b{color:var(--warm);margin-left:6px}
.it{border-top:1px solid var(--line);padding:10px 12px;font-size:14px}.ih{font-weight:700}
.src{color:var(--mut);font-size:13px;margin:2px 0 4px}.it p{margin:3px 0}
.lb{display:inline-block;font-size:11.5px;color:#fff;background:var(--navy2);border-radius:4px;padding:0 6px;margin-right:6px}
.b3{font-size:11.5px;color:#fff;background:var(--warm);border-radius:4px;padding:0 5px}
.bw{font-size:11.5px;color:var(--navy2);border:1px solid var(--navy2);border-radius:4px;padding:0 5px}
.pk{background:#FBF1EC;border-radius:8px;padding:6px 8px}
.pl{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}.pd{font-weight:700;color:var(--navy);font-size:13.5px}.pl p{margin:3px 0 0;font-size:14px}
.note{font-size:12.5px;color:var(--mut)}
.out{background:none;border:1px solid #fff;color:#fff;border-radius:8px;padding:2px 10px;font-size:12.5px;cursor:pointer;margin-top:8px;font-family:inherit}
@media(max-width:560px){.br{grid-template-columns:110px 1fr 80px;font-size:12.5px}.sw,.pl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* 나의 국어 기록(2026-11-07): 이름 + 휴대폰 뒤 네 자리 → Apps Script(action=mystudy)가 본인 확인 후 제출 기록만 준다.
   문항 정보(유형, 핵심, 진단)는 공개된 회차 자료(data/mock-*.json)에서 읽어 이 화면에서 계산한다. */
const SUNEUNG = new Date('2026-11-19T00:00:00+09:00');
const E = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $app = document.getElementById('app');
const kst = () => new Date(Date.now() + 9 * 3600e3);
const dday = () => { const t = kst(); const today = Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); return Math.round((Date.UTC(2026, 10, 19) - today) / 864e5); };

function kind(id){
  if (/suneung/.test(id)) return '기출';
  if (/^(2027-06|2026-06|2027-09|2026-09)$/.test(id)) return '평가원';
  if (/^(2026-07|2027-10|2026-05|2025-05|2026-10|2026-03|2027-03)$/.test(id) || /^g\d-/.test(id)) return '교육청';
  return '사설';
}
function shortLabel(id, label){
  let m;
  if ((m = id.match(/^(\d{4})-suneung$/))) return m[1] + ' 수능';
  if (id === '2027-06' || id === '2026-06') return '6월 모평';
  if (id === '2027-09' || id === '2026-09') return '9월 모평';
  if ((m = id.match(/^(\d{4})-(\d{2})$/))) return Number(m[2]) + '월 학평';
  if ((m = id.match(/sss(\d)-0?(\d+)/))) return '상상 ' + m[1] + '-' + m[2];
  if ((m = id.match(/^2027-s(\d)-0?(\d+)/))) return (m[1] === '2' ? '상상 ' : '이감 ') + m[1] + '-' + m[2];
  if ((m = id.match(/batang-0?(\d+)/))) return '바탕 ' + m[1];
  return (label || id).replace(/^\d{4}학년도\s*/, '').slice(0, 10);
}
// 받침에 맞춰 '와/과'를 붙인다(한글로 끝나지 않으면 '와')
function wa(s){ const c = String(s).trim().slice(-1).charCodeAt(0); return s + ((c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? '과' : '와'); }
const KCOL = {'평가원':'#1F3A5F','교육청':'#4C6FA5','기출':'#8A9BB8','사설':'#C26A3D'};

function tagOf(q){
  const a = String(q.area || '').split('>')[0];
  const t = (q.type || '') + ' ' + (q.thinking || '');
  const core = q.coreElement || '';
  if (/^(언매|언어와매체|언어와 매체|언어|매체|화작|작문|화법|화법과 작문)$/.test(a)){
    if (/매체/.test(q.area || '') || /매체|댓글|화면|누리|블로그|뉴스레터|방송|소통/.test(t + core)) return '매체';
    if (/^(화작|작문|화법|화법과 작문)$/.test(a)) return '화법과 작문';
    return '문법';
  }
  if (/어휘|문맥상|바꿔 쓰|사전적/.test(t)) return '어휘';
  if (/보기|외적|사례|적용|상황|그림|그래프|자료/.test(t)) return a === '문학' ? '문학 〈보기〉 감상' : '독서 〈보기〉·사례 적용';
  if (a === '독서'){
    if (/견해|입장|비교|관점/.test(t)) return '독서 견해 비교';
    if (/추론|이유|전제|의미/.test(t)) return '독서 추론';
    return '독서 세부 내용 확인';
  }
  if (/표현|서술|시점|발화|어조|구절|시구|시어|소재|공간|기능/.test(t)) return '문학 표현과 구절 해석';
  return '문학 내용 이해';
}
const HOW = {
  '독서 〈보기〉·사례 적용': '〈보기〉의 조건마다 지문의 어느 개념과 이어지는지 줄을 그어 대응시키고, 선지마다 그 연결이 끝까지 맞는지 확인합니다.',
  '문학 〈보기〉 감상': '선지를 앞부분과 뒷부분으로 나누어, 뒷부분이 작품에 근거가 있는지 확인합니다.',
  '문법': '판단에 쓴 개념의 조건을 적은 뒤, 예를 하나씩 조건에 대입합니다.',
  '독서 추론': '선지의 판단을 받쳐 주는 지문 문장을 두 개 이상 찾아 이어 봅니다.',
  '독서 견해 비교': '견해마다 핵심 주장을 한 줄로 적고, 선지가 누구의 주장을 말하는지 먼저 정합니다.',
  '독서 세부 내용 확인': '선지의 핵심어가 나온 지문 문장을 찾아 표시하고, 서술어까지 같은지 확인합니다.',
  '문학 내용 이해': '인물의 말과 행동이 누구에게, 무엇에 대한 것인지 먼저 적습니다.',
  '문학 표현과 구절 해석': '구절의 앞뒤 한 줄을 함께 읽고, 그 구절이 가리키는 대상을 먼저 정합니다.',
  '매체': '선지마다 화면이나 대화에서 근거 문장을 찾아 표시한 뒤 고릅니다.',
  '화법과 작문': '선지의 판단이 대화나 초고의 어느 문장에서 나왔는지 표시합니다.',
  '어휘': '문맥 속 뜻을 먼저 쉬운 말로 바꾼 뒤 선지와 비교합니다.'
};

function showLogin(msg){
  $app.innerHTML = `
  <div class="hd"><small>[오름] 국어 학원</small><h1>나의 국어 기록</h1><small>모의고사 진단에 제출한 기록으로 점수 변화, 강점과 약점, 틀린 문항을 모아 봅니다.</small></div>
  <div class="card login">
    <label for="nm">이름</label><input id="nm" autocomplete="name" placeholder="예: 홍길동">
    <label for="p4">내 휴대폰 번호 마지막 네 자리</label><input id="p4" inputmode="numeric" maxlength="4" placeholder="예: 1234">
    <button id="go">기록 보기</button>
    <div class="err" id="err">${E(msg || '')}</div>
    <p class="note">학원에 등록된 학생 본인의 휴대폰 번호로 확인합니다. 번호를 여러 번 틀리면 10분 동안 조회가 멈춥니다.</p>
  </div>`;
  const go = document.getElementById('go');
  const run = () => lookup(document.getElementById('nm').value, document.getElementById('p4').value);
  go.onclick = run;
  document.getElementById('p4').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
}

async function lookup(name, p4){
  const err = document.getElementById('err'), go = document.getElementById('go');
  name = (String(name).match(/[가-힣]+/) || [''])[0];
  p4 = String(p4).replace(/\D/g, '');
  if (!name){ err.textContent = '이름을 입력해 주세요.'; return; }
  if (p4.length !== 4){ err.textContent = '휴대폰 번호 마지막 네 자리를 숫자로 입력해 주세요.'; return; }
  const url = window.OREUM_CONFIG && window.OREUM_CONFIG.SCRIPT_URL;
  if (!url){ err.textContent = '서버 주소를 찾지 못했습니다. 데스크에 알려 주세요.'; return; }
  go.disabled = true; err.textContent = '불러오는 중입니다…';
  try{
    const j = await fetch(url + '?action=mystudy&name=' + encodeURIComponent(name) + '&p4=' + p4).then(r => r.json());
    if (!j.ok){
      err.textContent = j.error === 'locked' ? '번호를 여러 번 틀려 조회가 잠시 멈췄습니다. 10분 뒤에 다시 해 주세요.'
        : j.error === 'notfound' ? '이름과 번호가 학원에 등록된 정보와 맞지 않습니다. 번호를 바꿨다면 데스크에 알려 주세요.'
        : '입력을 다시 확인해 주세요.';
      go.disabled = false; return;
    }
    if (!j.rows.length){ err.textContent = '아직 모의고사 진단에 제출한 기록이 없습니다.'; go.disabled = false; return; }
    await render(j);
  }catch(e){ err.textContent = '불러오지 못했습니다. 잠시 뒤 다시 해 주세요.'; go.disabled = false; }
}

async function render(j){
  const rounds = [];
  for (const r of j.rows){
    let d = null;
    try{ d = await fetch('data/mock-' + r['회차ID'] + '.json', {cache:'no-cache'}).then(x => x.ok ? x.json() : null); }catch(e){}
    if (!d || !d.questions) continue;
    rounds.push({ r, d });
  }
  if (!rounds.length){ showLogin('기록을 불러오지 못했습니다. 데스크에 알려 주세요.'); return; }
  const tot = {}, wr = {}, groups = {};
  const allW = [];
  for (const {r, d} of rounds){
    const ch = /^(lm|hs)$/.test(r['선택과목']) ? r['선택과목'] : null;
    const qs = {};
    for (const sc of Object.keys(d.questions)){
      for (const q of d.questions[sc]){ qs[sc + '-' + q.no] = q; if (sc === 'common' || sc === ch){ const t = tagOf(q); tot[t] = (tot[t] || 0) + 1; } }
    }
    const picks = {};
    String(r['선택선지'] || '').split(',').forEach(p => { const m = p.split(':'); if (m.length === 2) picks[m[0].trim()] = m[1].trim(); });
    String(r['틀린문항'] || '').split(',').map(s => s.trim()).filter(Boolean).forEach(key => {
      const q = qs[key]; if (!q) return;
      const no = key.split('-').pop(), t = tagOf(q);
      const pk = picks[no] || picks[key] || '';
      const i = '①②③④⑤'.indexOf(pk);
      const note = (i >= 0 && q.optionNotes) ? (q.optionNotes[String(i + 1)] || '') : '';
      const w = { r, no: Number(no), q, tag: t, pick: pk, note };
      wr[t] = (wr[t] || 0) + 1; (groups[t] = groups[t] || []).push(w); allW.push(w);
    });
  }
  const raws = rounds.map(x => Number(x.r['원점수']) || 0);
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  const acc = t => 100 - 100 * (wr[t] || 0) / tot[t];
  const tags = Object.keys(tot).filter(t => tot[t] >= 8).sort((a, b) => acc(b) - acc(a));
  const strong = tags.slice(0, 3), weak = tags.slice(-3).reverse();
  const easy = allW.filter(w => w.q.wr != null && w.q.wr < 25);
  const easyBy = {}; easy.forEach(w => easyBy[w.tag] = (easyBy[w.tag] || 0) + 1);
  const easyTop = Object.keys(easyBy).sort((a, b) => easyBy[b] - easyBy[a])[0];
  const n3 = allW.filter(w => w.q.three).length;
  const n = rounds.length;

  // 점수 그래프
  let chart = '';
  if (n >= 2){
    const W = 680, H = 250, L = 40, R = 14, T = 18, B = 52;
    const lo = Math.min(70, Math.floor((Math.min(...raws) - 3) / 5) * 5), hi = 100;
    const X = i => L + i * (W - L - R) / (n - 1), Y = v => T + (hi - v) * (H - T - B) / (hi - lo);
    let g = '';
    for (let v = lo; v <= hi; v += 5) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E3E8F0"/><text x="${L - 6}" y="${Y(v) + 4}" font-size="11" fill="#7A8699" text-anchor="end">${v}</text>`;
    g += `<polyline points="${raws.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="#B7C3D6" stroke-width="2"/>`;
    rounds.forEach(({r}, i) => {
      const v = raws[i], x = X(i), k = kind(r['회차ID']);
      g += `<circle cx="${x}" cy="${Y(v)}" r="5" fill="${KCOL[k]}"/><text x="${x}" y="${Y(v) - 9}" font-size="10.5" fill="#2b2b2b" text-anchor="middle">${v}</text>`;
      g += `<text x="${x}" y="${H - B + 16}" font-size="9.5" fill="#7A8699" text-anchor="end" transform="rotate(-50 ${x} ${H - B + 16})">${E(shortLabel(r['회차ID'], r['회차이름']))}</text>`;
    });
    chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="원점수 변화 그래프">${g}</svg><div>${Object.entries(KCOL).map(([k, c]) => `<span class="lg"><i style="background:${c}"></i>${k}</span>`).join('')}</div>`;
  }
  const half = Math.min(10, Math.floor(n / 2)), recent = Math.min(5, Math.ceil(n / 2));
  const best = Math.max(...raws), bestR = rounds[raws.indexOf(best)].r;
  const kpi = `<div class="kp"><div class="k"><b>${avg(raws).toFixed(1)}</b><span>${n}회 평균 원점수</span></div>`
    + (n >= 4 ? `<div class="k"><b>${avg(raws.slice(0, half)).toFixed(1)} → ${avg(raws.slice(-recent)).toFixed(1)}</b><span>처음 ${half}회 평균 → 최근 ${recent}회 평균</span></div>` : '')
    + `<div class="k"><b>${best}</b><span>최고점(${E(shortLabel(bestR['회차ID'], bestR['회차이름']))})</span></div></div>`;

  const bars = tags.map(t => { const a = acc(t), c = a >= 90 ? '#1F3A5F' : (a >= 80 ? '#4C6FA5' : '#C26A3D');
    return `<div class="br"><div class="bl">${E(t)}</div><div class="bt"><div class="bf" style="width:${a.toFixed(0)}%;background:${c}"></div></div><div class="bv">${a.toFixed(0)}%<small> (${tot[t] - (wr[t] || 0)}/${tot[t]})</small></div></div>`; }).join('');

  let summary = `${n}회 동안 ${allW.length}문항을 틀렸고, 그중 3점 문항이 ${n3}문항입니다.`;
  if (weak[0] && wr[weak[0]]) summary += ` 정답률이 가장 낮은 유형은 ${weak[0]}(${acc(weak[0]).toFixed(0)}%)입니다.`;
  if (easy.length) summary += ` 전국 오답률이 25% 미만인 쉬운 문항도 ${easy.length}문항 틀렸고, 그중 ${easyBy[easyTop]}문항이 ${easyTop} 문항입니다.`;

  // 남은 날에 맞춘 전략
  const D = dday();
  const plan = [];
  const fmt = k => { const t = new Date(Date.UTC(2026, 10, 19) - k * 864e5); return (t.getUTCMonth() + 1) + '/' + t.getUTCDate(); };
  const span = (a, b) => (a === b ? fmt(a) + ' (D-' + a + ')' : fmt(a) + '~' + fmt(b) + ' (D-' + a + '~D-' + b + ')');
  const w1 = weak[0], w23 = weak.slice(1, 3).filter(t => wr[t]);
  if (D >= 2){
    const days = D - 1;
    const p1 = Math.max(1, Math.round(days * 0.35)), p2 = w23.length ? Math.max(1, Math.round(days * 0.25)) : 0, p3 = days - p1 - p2;
    let k = D;
    if (w1 && wr[w1]){
      const c = (groups[w1] || []).length;
      plan.push([span(k, k - p1 + 1), w1 + ' 다시 풀기', `아래 ‘틀린 문항 모음’의 ${w1} ${c}문항을 하루 ${Math.ceil(c / p1)}문항씩 다시 풉니다. ${HOW[w1] || ''}`]);
      k -= p1;
    }
    if (p2 && k > 1){
      plan.push([span(k, Math.max(2, k - p2 + 1)), (w23.length > 1 ? wa(w23[0]) + ' ' + w23[1] : w23[0]) + ' 다시 풀기', w23.map(t => `${t} ${(groups[t] || []).length}문항: ${HOW[t] || ''}`).join(' ')]);
      k -= p2;
    }
    if (k > 1){
      let txt = '최근 평가원 기출로 80분 실전을 풀고, 시험 순서와 시간 배분을 정해 둡니다.';
      if (easy.length) txt += ` 쉬운 문항에서 ${easy.length}문항을 놓쳤고 그중 ${easyBy[easyTop]}문항이 ${easyTop} 문항이었습니다. ${HOW[easyTop] || ''} 마킹 전 2분은 이 유형만 다시 봅니다.`;
      plan.push([span(k, 2), '실전 연습과 마지막 점검 순서 고정', txt]);
    }
    plan.push([fmt(1) + ' (D-1)', '정리와 컨디션', '새 문제는 풀지 않습니다. 이 화면의 ‘다시 볼 때’ 문장만 유형별로 읽고, 시험 순서와 시간 배분을 한 번 적어 둡니다.']);
  } else if (D === 1){
    plan.push([fmt(1) + ' (D-1)', '정리와 컨디션', '새 문제는 풀지 않습니다. 이 화면의 ‘다시 볼 때’ 문장만 유형별로 읽고, 시험 순서와 시간 배분을 한 번 적어 둡니다.']);
  }
  const planHtml = plan.map(([a, b, c]) => `<div class="pl"><div class="pd">${E(a)}</div><div><b>${E(b)}</b><p>${E(c)}</p></div></div>`).join('');

  const order = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
  const sec = order.map((t, gi) => `<details${gi === 0 ? ' open' : ''}><summary>${E(t)} <b>${groups[t].length}문항</b></summary>` + groups[t].map(w => {
    const q = w.q;
    return `<div class="it"><div class="ih">${E(shortLabel(w.r['회차ID'], w.r['회차이름']))} ${w.no}번${q.three ? ' <span class="b3">3점</span>' : ''}${q.wr != null ? ` <span class="bw">전국 오답률 ${Math.round(q.wr)}%</span>` : ''}</div>`
      + `<div class="src">${E(q.source || '')}</div>`
      + `<p><span class="lb">발문 유형</span>${E(q.type || '')}</p>`
      + (q.coreElement ? `<p><span class="lb">핵심</span>${E(q.coreElement)}</p>` : '')
      + (w.pick ? `<p class="pk"><b>내가 고른 답 ${E(w.pick)}</b>${w.note ? ' — ' + E(w.note) : ''}</p>` : '')
      + (q.remediation ? `<p><span class="lb">다시 볼 때</span>${E(q.remediation)}</p>` : '') + '</div>';
  }).join('') + '</details>').join('');

  const last = rounds[rounds.length - 1].r;
  const choice = last['선택과목'] === 'lm' ? '언어와 매체' : last['선택과목'] === 'hs' ? '화법과 작문' : '';
  $app.innerHTML = `
  <div class="hd">${D > 0 ? `<span class="dd">수능 D-${D}</span>` : ''}<small>[오름] 국어 학원 · 나의 국어 기록</small><h1>${E(j.name)} 학생</h1>
    <small>${E(last['학교'] || j.school || '')} ${E((last['학년'] || '').replace('고', '') ? (last['학년'] || '').replace('고', '') + '학년' : '')}${choice ? ' · ' + choice : ''} · 모의고사 ${n}회 기록</small><br>
    <button class="out" onclick="showLogin()">다른 이름으로 보기</button></div>
  <div class="card"><h2>점수 변화</h2>${kpi}<div style="margin-top:10px">${chart}</div></div>
  <div class="card"><h2>강점과 약점</h2>
    ${tags.length >= 4 ? `<div class="sw"><div class="st"><b>강점</b>${strong.map(t => E(t) + ' ' + acc(t).toFixed(0) + '%').join('<br>')}</div><div class="wk"><b>약점</b>${weak.map(t => E(t) + ' ' + acc(t).toFixed(0) + '%').join('<br>')}</div></div>` : ''}
    <p style="font-size:14px">${E(summary)}</p>
    <h2 style="margin-top:14px">문항 유형별 정답률</h2>${bars}
    <p class="note">정답률 = 내가 푼 회차에 나온 그 유형 문항 중 맞힌 비율(8문항 이상 나온 유형만)</p></div>
  ${planHtml ? `<div class="card"><h2>수능까지 ${D}일, 필승 전략</h2>${planHtml}</div>` : ''}
  <div class="card"><h2>틀린 문항 모음 (${allW.length}문항)</h2><p class="note">유형을 누르면 펼쳐집니다. 회차와 번호, 지문, 내가 고른 답과 진단을 함께 보여 줍니다.</p>${sec}</div>`;
  window.scrollTo(0, 0);
}
showLogin();
</script>
</body>
</html>
